[project]
name = "pravass-experiments"
version = "1.0.0"
description = "Experiments reproducing \"Robust Task-Aware State Estimation from Pretrained Perception\" (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.5.7",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "s3e[calibration,openai]==0.2.0",  # the pipeline uses the s3e 0.2 API
    "pravass",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "unified-planning[fast-downward]>=1.3.0",
    "up-cpor",
]

[project.optional-dependencies]
flash = [
  "torch>=2.2",
  "flash-attn",
]

[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "setuptools>=70.1",
  "wheel",
  "packaging",
  "psutil",
  "ninja",
  "numpy",
]

[tool.uv.sources]
pravass = { path = "..", editable = false }
up-cpor = { workspace = true, editable = false }
unified-planning = { git = "https://github.com/aiplan4eu/unified-planning", rev = "42e28d3703635f63be53d040f4091bb919d176fd" }

[tool.uv.workspace]
members = [
    "up-cpor",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest"]
